name: Deploy Quality Dashboard

on:
  push:
    branches:
      - feature/swagger-docs
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-quality-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Inyectar fecha y Run ID en el dashboard
        run: |
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -i "s|feature/swagger-docs|feature/swagger-docs · Run #${{ github.run_number }}|g" docs/index.html
          echo "Dashboard listo: $RUN_DATE"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4