name: OWASP ZAP - API Security Scan

on:
  push:
    branches:
      - feature/swagger-docs
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Prism
        run: npm install -g @stoplight/prism-cli

      - name: Levantar Prism en background
        run: nohup prism mock swagger.yaml &

      - name: Esperar que Prism levante
        run: sleep 5

      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://127.0.0.1:4010'
          format: openapi
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-I'
